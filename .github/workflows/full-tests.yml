name: Full tests
# The full tier — every Go test (`-tags full`: the Bash++ evaluator files that
# build or run Go programs with the reviewed toolchain), the Bash 5.2 confirm
# run, and the Bash++ race/lifecycle gate. Runs on tags and by hand; the push
# gate is test.yml (`make test-quick`). See the note at the top of test.yml for
# why the two were split on 2026-09-17.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      race_gate:
        description: 'Run the Bash++ race/lifecycle gate (Linux; up to ~80 minutes)'
        type: boolean
        default: true

jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.27.x]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: -tags=netgo,full
    # The Linux race/lifecycle gate runs a bounded schedule matrix plus the
    # complete race suite; keep CI from killing it before its own diagnostics.
    # The gate's bounded operations total at most 8340s and its global
    # watchdog adds one minute for orchestration. A job-level kill reports no
    # lane, so leave room for the full suite (~35 minutes) before it.
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        cache: false

    # Compile every full-tag package once, then isolate every top-level test,
    # example, and fuzz seed corpus in its own bounded test-binary process.
    # The runner writes an inventory and result reconciliation on both lanes.
    - run: make test-full
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: full-test-inventory-${{ matrix.os }}-${{ matrix.go-version }}
        path: artifacts/full-test
        if-no-files-found: error

    - name: Bash++ race lifecycle gate
      run: make bashpp-race-gate
      if: matrix.os == 'ubuntu-latest' && (github.event_name != 'workflow_dispatch' || inputs.race_gate)
    - uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-latest' && always() && hashFiles('artifacts/bashpp-race-gate.txt') != ''
      with:
        name: bashpp-race-gate-${{ matrix.os }}-${{ matrix.go-version }}
        path: artifacts/bashpp-race-gate.txt
        if-no-files-found: error
    - name: confirm tests with Bash 5.2
      run: |
        go install mvdan.cc/dockexec@latest
        CGO_ENABLED=0 go test -run TestRunnerRunConfirm -exec 'dockexec bash:5.2' ./interp
      if: matrix.os == 'ubuntu-latest'
