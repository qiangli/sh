on: [push, pull_request]
name: Test
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.27.x]
        # TODO(next sprint): re-add windows-latest. The interp test suite
        # currently hangs on windows (10m timeout); deferred for a focused
        # windows-specific debugging pass. Linux + macOS + alpine are green.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The Linux race/lifecycle gate runs a bounded schedule matrix plus the
    # complete race suite; keep CI from killing it before its own diagnostics.
    # The gate's own global deadline is 1800s and it reports WHICH lane hung;
    # a job-level kill reports nothing, so this must stay above it with room
    # for the rest of the steps.
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        cache: false

    # Darwin signal dispositions are process-global. Isolate the large interp
    # suite into bounded processes so signal conformance cases cannot leave
    # runtime receiver state that affects hundreds of later tests. Every test
    # still runs; the regexes partition Test* names and examples run last.
    - name: Test with isolated Darwin signal state
      run: |
        go list ./... | grep -v '/interp$' | xargs go test
        for group in 'A-E' 'F-J' 'K-O' 'P-T' 'U-Z'; do
          go test ./interp -run "^Test[$group]"
        done
        go test ./interp -run '^Example'
      if: matrix.os == 'macos-latest'
    - run: go test ./...
      if: matrix.os != 'macos-latest'
    - run: cd moreinterp && go test ./...

    - name: Bash++ race lifecycle gate
      run: make bashpp-race-gate
      if: matrix.os == 'ubuntu-latest'
    - uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-latest' && always()
      with:
        name: bashpp-race-gate-${{ matrix.os }}-${{ matrix.go-version }}
        path: artifacts/bashpp-race-gate.txt
        if-no-files-found: error
    - name: confirm tests with Bash 5.3
      run: |
        go install mvdan.cc/dockexec@latest
        CGO_ENABLED=0 go test -run TestRunnerRunConfirm -exec 'dockexec bash:5.3' ./interp
      if: matrix.os == 'ubuntu-latest'

    # Test that we can build for platforms that we can't currently test on.
    # Windows is build-validated here (catches regressions like the killSig fix);
    # its interp test suite hangs on a real runner, so the test-run stays deferred.
    - if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.27.x'
      run: |
        GOOS=windows GOARCH=amd64 go build ./...
        GOOS=windows GOARCH=arm64 go build ./...
        GOOS=plan9 GOARCH=amd64 go build ./...
        GOOS=js GOARCH=wasm go build ./...

    # Static checks from this point forward. Only run on one Go version and on
    # Linux, since it's the fastest platform, and the tools behave the same.
    - if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.27.x'
      run: diff <(echo -n) <(gofmt -s -d .)
    - if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.27.x'
      run: go vet ./...

  # Build (not test) sh natively on Windows: validates the Windows toolchain path
  # for real (killSig, the /c/ path mapping, etc.). The interp test suite hangs on
  # a Windows runner (readline/PTY), so the test-run stays deferred.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: 1.27.x
        cache: false
    - run: go build ./...
    - run: cd moreinterp && go build ./...
    - run: go vet ./...
